name: Refresh Genesis Radar Feed
# manual status refresh 2026-09-21T08:05Z
# relay smoke-check refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-feed.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genesis-radar-feed-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch sanitized feeds
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://89-125-209-50.sslip.io/13f46995dd02804e627ebac6ecf08c4480cd922729983de4"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            "$BASE/feed.json" -o feed.json.new
          python3 -m json.tool feed.json.new >/dev/null
          mv feed.json.new feed.json

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            "$BASE/miners.json" -o miners.json.new
          python3 -m json.tool miners.json.new >/dev/null
          mv miners.json.new miners.json

      - name: Commit only when changed
        shell: bash
        run: |
          set -euo pipefail
          git add feed.json miners.json
          if git diff --cached --quiet; then
            echo "No relay change."
            exit 0
          fi

          git config user.name "genesis-radar-bot"
          git config user.email "genesis-radar-bot@users.noreply.github.com"
          git commit -m "Update Genesis Radar relay"
          git push
